[tool.poetry]
name = "ai-agent-service"
version = "0.1.0"
description = "AI Agent Service with LangGraph, MCP tools, and multi-model support"
authors = ["Workflow Orchestration Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
langgraph = "^0.2.0"
langchain = "^0.1.0"
langchain-anthropic = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-community = "^0.0.20"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.1"
httpx = "^0.26.0"
python-multipart = "^0.0.6"
mcp = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.12.0"
ruff = "^0.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
